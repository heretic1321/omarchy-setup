### Core
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"       # truecolor
set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g renumber-windows on
setw -g mode-keys vi
set -g set-clipboard on                  # OSC52 → system clipboard via WezTerm

### Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

### Windows/Tabs
set -g base-index 1
setw -g pane-base-index 1
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind & kill-window
bind n next-window
bind p previous-window
bind w choose-tree -Zw                    # fuzzy-ish tree picker

### Panes
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind q display-panes
bind Space select-layout tiled
bind 1 select-layout main-horizontal
bind 2 select-layout main-vertical
bind 3 select-layout tiled

# Move between panes with Ctrl-h/j/k/l (works with Neovim via plugin below)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize quickly with Alt-h/j/k/l
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 5

# Sync panes toggle
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

### Copy mode (vi-style) — y to copy, V to block-select
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-line
bind P paste-buffer

### Quality-of-life
bind r source-file ~/.tmux.conf \; display-message "reloaded"
bind L last-window
bind H swap-pane -U
bind J swap-pane -D

# --- restore numeric window switching
unbind 1
unbind 2
unbind 3
bind -r 1 select-window -t:=1
bind -r 2 select-window -t:=2
bind -r 3 select-window -t:=3
bind -r 4 select-window -t:=4
bind -r 5 select-window -t:=5
bind -r 6 select-window -t:=6
bind -r 7 select-window -t:=7
bind -r 8 select-window -t:=8
bind -r 9 select-window -t:=9

# Optional: switch windows with Alt+number (no prefix)
bind -n M-1 select-window -t:=1
bind -n M-2 select-window -t:=2
bind -n M-3 select-window -t:=3
bind -n M-4 select-window -t:=4
bind -n M-5 select-window -t:=5
bind -n M-6 select-window -t:=6
bind -n M-7 select-window -t:=7
bind -n M-8 select-window -t:=8
bind -n M-9 select-window -t:=9

# --- give layouts new keys that don't clash
unbind Space
bind Space next-layout              # cycle all layouts
bind = select-layout main-horizontal
bind + select-layout main-vertical  # Shift+= is '+'

### Statusline (simple, fast; theme later if you want)
set -g status-interval 2
set -g status-left  "#[bold]#S #[fg=8]|#[default]"
set -g status-right "#[fg=8]#(whoami)@#H #[fg=8]| #[default]%Y-%m-%d %H:%M"

### TPM + plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'        # great clipboard defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'              # fast fuzzy pane/window/sess
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-yank: use system clipboard by default (works via OSC52 in WezTerm)
set -g @yank_selection 'clipboard'

# tmux-resurrect/continuum: auto-save/restore sessions
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
